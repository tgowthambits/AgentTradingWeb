# Multi-Symbol Trading Configuration
# ===================================

# List of symbols to analyze
symbols:
  - "BSE:SENSEX2610185100PE"
  - "BSE:SENSEX2610185100CE"
  - "NSE:NIFTY25DEC26050PE"
  - "NSE:NIFTY25DEC26050CE"
